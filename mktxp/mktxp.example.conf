[default]
    port = 8729
    use_ssl = True
    ssl_certificate_verify = True
    ssl_check_hostname = True
    ssl_ca_file = /etc/mktxp/ca-bundle.crt
    
    # Coleta principal
    health = True
    monitor = True
    resource = True
    routerboard = True
    
    # Interfaces e rede
    interface = True
    route = True
    neighbor = True
    public_ip = True
    
    # DHCP
    dhcp = True
    dhcp_lease = True
    pool = True
    
    # Sistema
    installed_packages = True
    user = True
    
    # Rede / tráfego
    connections = True
    connection_stats = False
    queue = True
    
    # Recursos adicionais
    firewall = True
    netwatch = True
    address_list_entries = True
    total_address_list_counts = True
    
    # Wireless / CAPsMAN
    wireless = True
    wireless_clients = True
    capsman = True
    capsman_clients = True
    
    # TLS / API
    plaintext_login = True
    
    # Recursos não utilizados
    bgp = False
    bfd = False
    bridge_vlan = False
    certificate = False
    check_for_updates = False
    container = False
    dns = False
    eoip = False
    gre = False
    ipip = False
    ipsec = False
    kid_control_assigned = False
    kid_control_dynamic = False
    lte = False
    poe = False
    routing_stats = False
    switch_port = False
    wireguard_peers = False
    w60g = False
    
    # IPv6
    ipv6_address_list_entries = False
    ipv6_firewall = False
    ipv6_neighbor = False
    ipv6_pool = False
    ipv6_route = False
    ipv6_total_address_list_counts = False
    
    # Configuracoes auxiliares
    credentials_file = ""
    remote_dhcp_entry = None
    remote_capsman_entry = None
    address_list = None
    ipv6_address_list = None
    custom_labels = None
    interface_name_format = name
    probe_allowed_targets = None
    rsc_ssh_port = None
    rsc_ssh_user = None

